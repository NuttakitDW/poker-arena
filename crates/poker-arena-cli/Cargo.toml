[package]
name = "poker-arena-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line match runner for poker-arena."

[dependencies]
poker-arena = { workspace = true }
poker-core = { workspace = true, features = ["serde"] }
poker-wire = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "poker_arena_cli"
path = "src/lib.rs"

[[bin]]
name = "poker-arena"
path = "src/main.rs"

[[bin]]
name = "poker-arena-ofc"
path = "src/ofc.rs"
