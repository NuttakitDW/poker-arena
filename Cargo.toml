[workspace]
members = [
    "crates/poker-core",
    "crates/poker-wire",
    "crates/poker-arena",
    "crates/poker-arena-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A poker bot competition arena supporting many poker variants."

[workspace.dependencies]
poker-arena = { path = "crates/poker-arena" }
poker-core = { path = "crates/poker-core" }
poker-wire = { path = "crates/poker-wire" }
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
serde = { version = "1", features = ["derive"] }

# `float_roundtrip`: without it, serde_json's float parser can be off by a
# few ULPs from what it wrote, which breaks the wire-report round-trip
# tests now that reports carry decision-timing floats computed from
# arbitrary wall-clock durations (see `poker-wire/src/report.rs` and its
# `ofc` counterpart).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

# The evaluator test suite sweeps all C(52,5) hands; keep tests optimized.
[profile.test]
opt-level = 2
